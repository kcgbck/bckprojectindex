name: Update Laws Data

on:
  schedule:
    # 🕒 한국 시간 밤 11시에 실행 (UTC 기준 14:00)
    - cron: '0 14 * * *'
  workflow_dispatch: # 수동 실행 버튼 생성

permissions:
  contents: write
  issues: write  # 실패 시 이슈 생성을 위해 필요

concurrency:
  group: update-laws-data
  cancel-in-progress: true

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: 내 저장소 코드 가져오기
        uses: actions/checkout@v4

      - name: Node.js 환경 세팅
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 법령 데이터 갱신 스크립트 실행
        id: run_update
        env:
          LAW_API_KEY: ${{ secrets.LAW_API_KEY }}
        run: node update_laws.js

      - name: 실패 진단 파일 보관
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: law-fetch-diagnostics-${{ github.run_id }}
          path: |
            laws_fetch_diagnostics.json
            laws_fetch_failures.json
          if-no-files-found: warn
          retention-days: 30

      - name: 만들어진 JSON 파일을 GitHub에 저장(Commit)
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 성공률 미달 시 스크립트가 기존 laws_data.json을 보존합니다.
          # 진단 상세 파일은 Actions Artifact로만 보관하며 저장소에는 커밋하지 않습니다.
          git add laws_data.json laws_fetch_failures.json 2>/dev/null || git add laws_data.json
          git commit -m "법령 데이터 자동 업데이트" || exit 0
          git push

      # 실패 파일이 존재하고 failCount가 1개 이상일 때만 이슈 생성
      - name: 법령 fetch 실패 시 GitHub 이슈 생성
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f laws_fetch_failures.json ]; then
            echo "실패 없음 - 이슈 생성 건너뜀"
            exit 0
          fi

          FAIL_COUNT=$(node -e "const d=JSON.parse(require('fs').readFileSync('laws_fetch_failures.json')); console.log(d.failCount);")
          if [ "${FAIL_COUNT}" -le 0 ]; then
            echo "실패 수가 0개 - 이슈 생성 건너뜀"
            exit 0
          fi

          SUCCESS_RATE=$(node -e "const d=JSON.parse(require('fs').readFileSync('laws_fetch_failures.json')); console.log(d.successRate);")
          FAIL_LIST=$(node -e "const d=JSON.parse(require('fs').readFileSync('laws_fetch_failures.json')); d.failedLaws.forEach(n=>console.log('- '+n));")
          DIAG_CATEGORY=$(node -e "const d=JSON.parse(require('fs').readFileSync('laws_fetch_failures.json')); console.log(d.diagnosticSummary?.category ?? 'UNKNOWN');")
          DIAG_EXPLANATION=$(node -e "const d=JSON.parse(require('fs').readFileSync('laws_fetch_failures.json')); console.log(d.diagnosticSummary?.explanation ?? '진단 설명 없음');")
          IP_BLOCK_CONCLUSION=$(node -e "const d=JSON.parse(require('fs').readFileSync('laws_fetch_failures.json')); console.log(d.diagnosticSummary?.ipBlockConclusion ?? '판단 불가');")
          EGRESS_IP=$(node -e "const d=JSON.parse(require('fs').readFileSync('laws_fetch_failures.json')); console.log(d.egressIp ?? '확인 실패');")
          DATE=$(node -e "console.log(new Date().toLocaleString('ko-KR', {timeZone:'Asia/Seoul'}))")

          TITLE="[법령 DB 업데이트 실패] ${FAIL_COUNT}개 법령 수집 실패 (성공률 ${SUCCESS_RATE}%)"
          EXISTING_ISSUE=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$EXISTING_ISSUE" ]; then
            echo "이미 열린 동일 실패 이슈 #${EXISTING_ISSUE}가 있어 새 이슈 생성을 건너뜀"
            exit 0
          fi

          BODY="## ⚠️ 법령 데이터 자동 갱신 중 오류 발생

          **발생 시각:** ${DATE}
          **성공률:** ${SUCCESS_RATE}%
          **실패 법령 수:** ${FAIL_COUNT}개

          ### 자동 진단
          - **분류:** ${DIAG_CATEGORY}
          - **GitHub Actions 출구 IP:** ${EGRESS_IP}
          - **해석:** ${DIAG_EXPLANATION}
          - **IP 차단 판단:** ${IP_BLOCK_CONCLUSION}
          - **상세:** 실행 산출물 \`laws_fetch_diagnostics.json\` 및 Actions Artifact 확인

          ### 실패한 법령 목록
          ${FAIL_LIST}

          ### 조치 방법
          1. \`laws_fetch_diagnostics.json\`의 \`preflight.apiConnectionProbe\`와 \`failureRecords\` 확인
          2. \`TCP_CONNECT_TIMEOUT\`이면 다른 고정 IP 서버(예: Oracle Tokyo)에서 같은 워크플로를 실행해 비교
          3. \`HTTP_ACCESS_DENIED\`이면 국가법령정보 공동활용의 OC·서버 IP·이용승인 상태 확인
          4. \`HTTP_RATE_LIMIT\`이면 호출 간격과 제한 정책 확인"

          if gh issue create \
            --title "$TITLE" \
            --body "$BODY" \
            --label "bug" \
            2>/dev/null; then
            echo "이슈 생성 완료"
            exit 0
          fi

          echo "레이블/담당자 포함 이슈 생성 실패 - 기본 이슈로 1회만 재시도"
          gh issue create \
            --title "$TITLE" \
            --body "$BODY" \
            2>/dev/null || echo "이슈 생성 실패 - 수집 실패 파일만 커밋됨"
